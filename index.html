<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Farm新食活動｜課程｜餐會 - 崁仔頂魚市場踏查、解魚秀×板前料理，更多活動陸續推出">
<title>Farm新食活動｜課程｜餐會</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF3EF;
    --paper-deep:#F5E4DC;
    --ink:#3A3530;
    --ink-soft:#7A756D;
    --wine:#3FA790;
    --wine-deep:#2C7D6B;
    --coral:#F0806B;
    --coral-deep:#E0654F;
    --gold:#F0806B;
    --line:#EAD4C8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Serif TC", serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(192,138,62,0.06), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(44,110,99,0.08), transparent 45%);
    pointer-events:none;
    z-index:0;
  }
  .wrap{max-width:640px;margin:0 auto;position:relative;z-index:1;}

  .hero-header{
    padding:48px 24px 28px;
    text-align:center;
  }
  .hero-header .brand{
    font-size:24px;
    font-weight:700;
    color:var(--wine-deep);
    letter-spacing:0.08em;
    margin-bottom:8px;
  }
  .hero-header .tagline{
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:0.15em;
  }

  .divider{
    display:flex;align-items:center;gap:14px;
    padding:10px 40px 22px;
    color:var(--gold);
  }
  .divider::before,.divider::after{
    content:"";flex:1;height:1px;
    background:linear-gradient(to right, transparent, var(--line), transparent);
  }
  .divider span{font-size:12px;letter-spacing:0.3em;}

  .category-menu{ padding:0 16px 40px; }
  .category-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .category-btn{
    display:flex;
    align-items:center;
    gap:10px;
    background:#FFFFFF;
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:14px 14px;
    cursor:pointer;
    text-align:left;
    text-decoration:none;
    font-family:"Noto Serif TC", serif;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease;
    box-shadow:0 4px 10px -4px rgba(46,58,59,0.12);
    position:relative;
  }
  .category-btn.disabled{
    opacity:0.5;
    cursor:default;
    pointer-events:none;
  }
  .category-btn:active{ transform:scale(0.97); }
  .category-icon{
    flex-shrink:0;
    width:38px;height:38px;
    border-radius:50%;
    background:var(--paper-deep);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
  }
  .category-label{
    font-size:14px;
    font-weight:700;
    color:var(--wine-deep);
    letter-spacing:0.03em;
    line-height:1.4;
  }
  .category-sub{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .category-arrow{
    margin-left:auto;
    color:var(--gold);
    font-size:14px;
    flex-shrink:0;
  }

  .section-label{
    font-size:12px;
    letter-spacing:0.25em;
    color:var(--ink-soft);
    padding:0 20px 10px;
  }

  footer{
    text-align:center;
    padding:20px 20px 50px;
    font-size:12px;
    letter-spacing:0.1em;
    color:#8C8A70;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero-header">
    <div class="brand">Farm新食</div>
    <div class="tagline">活動｜課程｜餐會</div>
  </div>

  <div class="divider"><span>探索所有活動</span></div>

  <div class="category-menu">
    <div class="section-label">🐟 直擊市集</div>
    <div class="category-grid" style="margin-bottom:24px;">
      <a href="keelung-market/#event-details" class="category-btn">
        <div class="category-icon">🐟</div>
        <div>
          <div class="category-label">崁仔頂魚市</div>
          <div class="category-sub">09/06（日）凌晨場</div>
        </div>
        <div class="category-arrow">›</div>
      </a>
      <div class="category-btn disabled">
        <div class="category-icon">🥬</div>
        <div>
          <div class="category-label">希望廣場農民市集</div>
          <div class="category-sub">籌備中</div>
        </div>
      </div>
    </div>

    <div class="section-label">🔪 解魚秀｜板前料理</div>
    <div class="category-grid" style="margin-bottom:24px;">
      <a href="knife-show/#event-details" class="category-btn" style="grid-column:1 / -1;">
        <div class="category-icon">🔪</div>
        <div>
          <div class="category-label">解魚秀 × 板前料理</div>
          <div class="category-sub">09/06（日）16:00-19:00</div>
        </div>
        <div class="category-arrow">›</div>
      </a>
    </div>

    <div class="section-label">👩‍🍳 料理與烘焙課程</div>
    <div class="category-grid" style="margin-bottom:24px;">
      <div class="category-btn disabled">
        <div class="category-icon">🍳</div>
        <div><div class="category-label">共煮</div><div class="category-sub">籌備中</div></div>
      </div>
      <div class="category-btn disabled">
        <div class="category-icon">🎓</div>
        <div><div class="category-label">大師班</div><div class="category-sub">籌備中</div></div>
      </div>
      <div class="category-btn disabled">
        <div class="category-icon">🧒</div>
        <div><div class="category-label">兒童班</div><div class="category-sub">籌備中</div></div>
      </div>
      <div class="category-btn disabled">
        <div class="category-icon">🧑</div>
        <div><div class="category-label">成人班</div><div class="category-sub">籌備中</div></div>
      </div>
    </div>

    <div class="section-label">🍵 心靈雞湯餐會</div>
    <div class="category-grid">
      <a href="soul-soup/" class="category-btn" style="grid-column:1 / -1;">
        <div class="category-icon">🍵</div>
        <div>
          <div class="category-label">心靈雞湯不說教：行業鬼故事大掃除</div>
          <div class="category-sub">已結束</div>
        </div>
        <div class="category-arrow">›</div>
      </a>
    </div>
  </div>

  <footer>
    © Farm新食｜活動．課程．餐會。All Rights Reserved.
  </footer>

</div>
</body>
</html>
